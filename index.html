<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>दैनिक - शासकीय माहिती व जीआर पोर्टल</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 0;
            /* बॅकग्राउंडला वॉटरमार्क म्हणून राष्ट्रीय चिन्ह (राजमुद्रा) */
            background-image: linear-gradient(rgba(244, 246, 249, 0.93), rgba(244, 246, 249, 0.93)), 
                              url('https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: 300px;
        }
        
        /* मुख्य हेडर */
        header { 
            background-color: #0d47a1; 
            color: white; 
            text-align: center; 
            padding: 20px 15px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .header-emblem {
            height: 60px;
            filter: brightness(0) invert(1);
        }

        .header-text h1 { margin: 0; font-size: 26px; letter-spacing: 1px; }
        .header-text p { margin-top: 5px; font-size: 13px; opacity: 0.9; }

        /* संस्थापक माहिती कार्ड */
        .owner-info { 
            background: rgba(227, 242, 253, 0.9); 
            border: 1px solid #bbdefb; 
            border-radius: 8px; 
            padding: 15px; 
            margin-bottom: 20px; 
            text-align: center;
        }
        .owner-info h2 { margin: 0 0 5px 0; color: #0d47a1; font-size: 18px; }
        .owner-info p { margin: 3px 0; color: #333; font-size: 13px; }
        
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        
        /* जीआर व नोटीस कार्ड्स */
        .card { 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 8px; 
            padding: 18px; 
            margin-bottom: 15px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            border-left: 5px solid #0d47a1; 
        }
        .card.notice { border-left-color: #d32f2f; }
        .card.holiday { border-left-color: #388e3c; }

        .date { font-size: 12px; color: #777; font-weight: bold; }
        h3 { margin: 6px 0; color: #2c3e50; font-size: 18px; }
        p { color: #555; font-size: 14px; line-height: 1.5; margin-bottom: 12px; }
        
        .btn { display: inline-block; background-color: #0d47a1; color: white; text-decoration: none; padding: 8px 14px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .btn:hover { background-color: #1565c0; }
        
        /* फुटर */
        footer { text-align: center; padding: 20px; color: #666; font-size: 13px; margin-top: 30px; background: rgba(224, 224, 224, 0.9); }
    </style>
</head>
<body>

    <header>
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" alt="National Emblem" class="header-emblem">
        <div class="header-text">
            <h1>📰 दैनिक</h1>
            <p>शासकीय निर्णय, जीआर व महत्त्वाच्या अपडेट्सचे अधिकृत पोर्टल</p>
        </div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" alt="National Emblem" class="header-emblem">
    </header>

    <div class="container">

        <!-- संस्थापक माहिती -->
        <div class="owner-info">
            <h2>👤 संस्थापक: करण सिंह काशिद</h2>
            <p>📧 ईमेल: example@email.com | 📱 मोबाईल: +९१ ९८७६५४३२१०</p>
            <p><i>दिल्ली व केंद्र सरकारच्या ताज्या नोटिसा आणि शासकीय निर्णय</i></p>
        </div>

        <!-- जीआर ऑटोमॅटिक लोड होणारा भाग -->
        <div id="gr-container">
            <p style="text-align:center;">ताजी माहिती व जीआर लोड होत आहेत...</p>
        </div>

    </div>

    <footer>
        <p>© २०२६ दैनिक पोर्टल | निर्मिती: <b>करण सिंह काशिद</b></p>
    </footer>

    <script>
        // data.json मधून माहिती ऑटोमॅटिक खेचणारा कोड
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('gr-container');
                container.innerHTML = ''; 

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `card ${item.category}`;

                    card.innerHTML = `
                        <span class="date">📅 दिनांक: ${item.date}</span>
                        <h3>${item.title}</h3>
                        <p>${item.description}</p>
                        <a href="${item.link}" target="_blank" class="btn">अधिक माहिती / जीआर पहा</a>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => {
                document.getElementById('gr-container').innerHTML = '<p style="text-align:center; color:red;">डेटा लोड करण्यात अडचण येत आहे. कृपया थोड्या वेळाने प्रयत्न करा.</p>';
            });
    </script>

</body>
</html>
